<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Nomes para Negócios</title>
    <meta name="author" content="Onivaldo Miquelino">          
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-5">
        <h1 class="mb-4">Gerador de Nomes e Slogans</h1>
        <form id="businessForm">
            <div class="mb-3">
                <label for="industry" class="form-label">Setor do Negócio:</label>
                <input type="text" class="form-control" id="industry" placeholder="Ex.: Tecnologia, Restaurante..." required>
            </div>
            <div class="mb-3">
                <label for="concept" class="form-label">Conceito:</label>
                <input type="text" class="form-control" id="concept" placeholder="Ex.: Inovador, Sustentável..." required>
            </div>
            <button type="submit" class="btn btn-primary">Gerar Ideias</button>
        </form>
        
        <div id="loadingIndicator" class="my-4" style="display: none;">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Carregando...</span>
            </div>
            <span class="ms-2">Gerando ideias criativas...</span>
        </div>
        
        <div id="resultsContainer" class="mt-4"></div>
    </div>

    <script>
        document.getElementById('businessForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            
            const industry = document.getElementById('industry').value;
            const concept = document.getElementById('concept').value;
            const loadingIndicator = document.getElementById('loadingIndicator');
            const resultsContainer = document.getElementById('resultsContainer');
            
            loadingIndicator.style.display = 'block';
            resultsContainer.innerHTML = '';
            
            try {
                const formData = new FormData();
                formData.append('industry', industry);
                formData.append('concept', concept);
                
                const response = await fetch('sendRequest.php', {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) {
                    throw new Error('Erro na resposta do servidor');
                }
                
                const data = await response.json();
                
                if (data.error) {
                    resultsContainer.innerHTML = `<div class="alert alert-danger">${data.error}</div>`;
                } else {
                    let html = '<h3>Ideias Geradas:</h3>';
                    data.choices.forEach((choice, index) => {
                        html += `
                        <div class="card my-2">
                            <div class="card-body">
                                <p class="card-text">${choice.message.content.replace(/\n/g, '<br>')}</p>
                            </div>
                        </div>`;
                    });
                    resultsContainer.innerHTML = html;
                }
            } catch (error) {
                console.error('Erro:', error);
                resultsContainer.innerHTML = '<div class="alert alert-danger">Ocorreu um erro ao processar sua solicitação.</div>';
            } finally {
                loadingIndicator.style.display = 'none';
            }
        });
    </script>
</body>
</html>
